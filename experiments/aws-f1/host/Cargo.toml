[package]
name = "hashwx-f1-fixtures"
version = "0.1.0"
edition = "2024"
publish = false
[dependencies]
hashwx = { path = "../../..", default-features = false, features = ["hashx"] }

[features]
aws-f1-sdk = []

[[bin]]
name = "hashwx-f1-solve"
path = "src/bin/solve.rs"
required-features = ["aws-f1-sdk"]

[[bin]]
name = "hashx-f1-fixtures"
path = "src/bin/hashx_fixtures.rs"

[[bin]]
name = "hashx-f1-solve"
path = "src/bin/solve_hashx.rs"
required-features = ["aws-f1-sdk"]

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.191"

[[bin]]
name = "hashwx-f1-pcim"
path = "src/bin/solve_pcim.rs"
