name: Publish crates.io

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v0.1.1
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: crates-io-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Install release toolchain
        run: rustup toolchain install 1.99.0 --profile minimal

      - name: Verify release ref
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" == v* ]] || {
            echo "release tag must start with v: $RELEASE_TAG" >&2
            exit 1
          }
          package_id="$(cargo +1.99.0 pkgid)"
          version="${package_id##*@}"
          test "$RELEASE_TAG" = "v$version" || {
            echo "release tag $RELEASE_TAG does not match crate version $version" >&2
            exit 1
          }
          test "$(git describe --tags --exact-match HEAD)" = "$RELEASE_TAG"
          git merge-base --is-ancestor HEAD origin/main || {
            echo "release tag $RELEASE_TAG is not on main" >&2
            exit 1
          }

      - name: Verify package
        run: cargo +1.99.0 publish --dry-run --locked

      - name: Authenticate to crates.io
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
        run: cargo +1.99.0 publish --locked
